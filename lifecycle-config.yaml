      attributes_url: "https://raw.githubusercontent.com/ansible/aap-docs/{minor}/downstream/attributes/attributes.adoc"
      features_search: "*red_hat_ansible_automation_platform*{minor}*release_notes*"
      release_notes_url: "https://docs.redhat.com/en/documentation/red_hat_ansible_automation_platform/{minor}/html/release_notes/"
    phase_map:
      "General availability": ga
      "Full support": fs_end
      "Maintenance Support 1": mnt_end
      "Maintenance support 2": mnt2_end
      "Extended update support": eus1_end
      "Extended update support Term 2": eus2_end
      "Extended life cycle support (ELS) add-on": els_end
    fallback:
