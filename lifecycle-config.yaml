# lifecycle-config.yaml — Declarative configuration for lifecycle-graph.py
#
# This file is the single source of truth for all product/operator/middleware data.
# Requires: pip install pyyaml
#
# Schema mirrors LIFECYCLE.md sections. See that file for field descriptions,
# phase key meanings, and version_strategy/phase_map_preset reference tables.
#
# Tip: dates must be quoted ("2024-05-18") so YAML does not auto-convert them.
# Unquoted bare dates like 2024-05-18 would be parsed as datetime objects.
#
# ── version_strategy values ──────────────────────────────────────────────────
#   ocp-minor    → 4.X OCP releases, EUS on even minors
#   xy           → X.Y versions, no EUS
#   xy-exact     → X.Y versions with strict 2-part numeric filter (e.g. Keycloak)
#   xy-eus-even  → X.Y versions, EUS on even Y
#   x-dotx       → "X.x" middleware versions — the API returns literal strings like "8.x"
#                   or "7.x"; only the major integer X is used for sorting and filtering.
#                   Use this for JBoss EAP / JWS where versions are "7.x", "8.x", not "7.3".
#   xy           → "X.Y" versions where both parts are real integers (e.g. "1.16", "4.14").
#                   Use this for operators and products that publish distinct minor releases.
#   rhel-major   → integer RHEL major versions (7, 8, 9, 10)
#   aap          → X.Y AAP versions
#   rhoai        → X.Y RHOAI versions (handles trailing *)
#   ceph         → integer Ceph versions
#   rolling-eol  → X.Y rolling-stream operators (GA + End of Life only)
#
# ── phase_map_preset values ──────────────────────────────────────────────────
#   op-standard    → Full Support / Maintenance / EUS-1 / EUS-2
#   op-odf         → Full Support / Maintenance / EUS-1 / EUS-2 / EUS-3
#   osp-els3       → Full Support / 3rd-party Cert / Maintenance / ELS-1 / ELS-2 / ELS-3
#   els2           → Full Support / Maintenance / ELS-1 / ELS-2
#   keycloak       → Full Support / Maintenance (no EUS)
#   rolling-ga-eol → General availability / End of Life only

# ── RHEL minor release dates ─────────────────────────────────────────────────
# Source: https://access.redhat.com/support/policy/updates/errata
# Phase names (subscription model — not the lifecycle API phase names):
#   Standard subscription — all minors (~6 months per minor)
#   Premium subscription additional maintenance — even minors (EUS, 2 years)
#   Extended Life Cycle, Premium subscription additional maintenance — even minors ≥ 9.2, 8.10, 10.2+ (6 years from GA)
#   Long Life add-on terms — last minor of each major (8.10, 9.10, 10.10)
#
# std_end:  next minor GA (end of Standard subscription window for this minor)
# eus_end:  end of Premium additional maintenance (even minors only, RHEL 8+)
# elc_end:  end of ELC, Premium (GA + 6 years; even minors ≥ 9.2, 8.10, 10.2+)
# elcp_end: end of Long Life add-on (last minor of each major only)

rhel_minors:
  "7":
    "7.0":  { ga: "2014-06-10", std_end: "2015-03-05" }
    "7.1":  { ga: "2015-03-05", std_end: "2015-11-19" }
    "7.2":  { ga: "2015-11-19", std_end: "2016-11-03" }
    "7.3":  { ga: "2016-11-03", std_end: "2017-07-31" }
    "7.4":  { ga: "2017-07-31", std_end: "2018-04-10", eus_end: "2019-08-31" }
    "7.5":  { ga: "2018-04-10", std_end: "2018-10-30" }
    "7.6":  { ga: "2018-10-30", std_end: "2019-08-06", eus_end: "2020-10-31" }
    "7.7":  { ga: "2019-08-06", std_end: "2020-03-31" }
    "7.8":  { ga: "2020-03-31", std_end: "2020-09-29" }
    "7.9":  { ga: "2020-09-29", std_end: "2024-06-30" }
  "8":
    "8.0":  { ga: "2019-05-07", std_end: "2019-11-05" }
    "8.1":  { ga: "2019-11-05", std_end: "2020-04-28" }
    "8.2":  { ga: "2020-04-28", std_end: "2020-11-03", eus_end: "2022-04-28" }
    "8.3":  { ga: "2020-11-03", std_end: "2021-05-18" }
    "8.4":  { ga: "2021-05-18", std_end: "2021-11-09", eus_end: "2023-05-31" }
    "8.5":  { ga: "2021-11-09", std_end: "2022-05-10" }
    "8.6":  { ga: "2022-05-10", std_end: "2022-11-08", eus_end: "2024-05-31" }
    "8.7":  { ga: "2022-11-08", std_end: "2023-05-16" }
    "8.8":  { ga: "2023-05-16", std_end: "2023-11-14", eus_end: "2025-05-31" }
    "8.9":  { ga: "2023-11-14", std_end: "2024-05-22" }
    # 8.10: final minor; eus_end aligns with RHEL 8 Maintenance end; Long Life extends to 2033-05-31
    "8.10": { ga: "2024-05-22", std_end: "2029-05-31", eus_end: "2026-05-31", elc_end: "2030-05-22", elcp_end: "2033-05-31" }
  "9":
    "9.0":  { ga: "2022-05-18", std_end: "2022-11-15" }
    "9.1":  { ga: "2022-11-15", std_end: "2023-05-10" }
    # ELC = GA + 6 years; even minors from 9.2 per Red Hat ELC policy
    "9.2":  { ga: "2023-05-10", std_end: "2023-11-07", eus_end: "2025-05-31", elc_end: "2029-05-10" }
    "9.3":  { ga: "2023-11-07", std_end: "2024-04-30" }
    "9.4":  { ga: "2024-04-30", std_end: "2024-11-12", eus_end: "2026-05-31", elc_end: "2030-04-30" }
    "9.5":  { ga: "2024-11-12", std_end: "2025-04-29" }
    "9.6":  { ga: "2025-04-29", std_end: "2025-11-04", eus_end: "2027-05-31", elc_end: "2031-04-29" }
    "9.7":  { ga: "2025-11-04", std_end: "2026-05-19" }
    # 9.8: future minor (projected ~May 2026); std_end = projected 9.9 GA; elc_end = GA + 6 years
    "9.8":  { ga: "2026-05-19", std_end: "2026-11-10", eus_end: "2028-05-31", elc_end: "2032-05-19" }
  "10":
    # 10.0: std_end = when 10.1 GAs (not yet published); EUS minors for RHEL 10 are 10.2, 10.4, 10.6, 10.8
    "10.0": { ga: "2025-05-20" }

# ── RHEL major release lifecycle (major-level view) ───────────────────────────
# RHEL still bypasses the lifecycle API for minors (use_major_phases: true), but
# the major-level ELS/Long Life dates below are sourced directly from the API's
# per-major `phases[]` array, which now carries real dates for these phases:
#   https://access.redhat.com/product-life-cycles/api/v1/products?name=Red+Hat+Enterprise+Linux
#
# std_end:  end of Standard subscription (= major Maintenance support end, year 10)
# els_end:  end of "Extended life cycle support (ELS) add-on" — RHEL 7 only
#           (API display_name "Extended Life Cycle (ELC)")
# elc_end:  end of the RHEL 8/9/10 "Extended life cycle support (ELS) add-on" window
#           (API display_name "Extended Life Cycle (ELC)")
#
# Long Life add-on ("Extended life phase" in the API) has NO end_date — the API
# marks it Ongoing. There is no ll_end field: once elc_end passes, the chart
# draws Long Life open-ended (same treatment as other open/ongoing phases).
rhel_majors:
  "7":  { ga: "2014-06-10", std_end: "2024-06-30", els_end: "2029-05-31" }
  "8":  { ga: "2019-05-07", std_end: "2029-05-31", elc_end: "2033-05-31" }
  "9":  { ga: "2022-05-18", std_end: "2032-05-31", elc_end: "2036-05-31" }
  "10": { ga: "2025-05-20", std_end: "2035-05-31", elc_end: "2039-05-31" }

# ── Main products ─────────────────────────────────────────────────────────────
# These entries define PRODUCT_CONFIGS — all data lives here, Python has no defaults.

products:
  ocp:
    api_name: "OpenShift Container Platform 4"
    title: "OCP Lifecycle"
    page_url: "https://access.redhat.com/support/policy/updates/openshift"
    info_html: "<b>EUS-1</b> (Extended Update Support, Term 1) is included in OpenShift Premium and Self-Managed Premium subscriptions at no extra cost. <b>EUS-2</b> (Term 2) requires an additional EUS add-on subscription. See the <a href=\"https://access.redhat.com/support/policy/updates/openshift\" target=\"_blank\">OCP lifecycle policy</a> for full details."
    version_strategy: ocp-minor
    min_version: "4.12"
    # Optional z-stream Details page (errata + release notes). {minor} is
    # substituted per minor version (e.g. "4.19") at build time.
    details:
      errata_query: "OpenShift Container Platform {minor}"
      release_notes_url: "https://docs.redhat.com/en/documentation/openshift_container_platform/{minor}/html/release_notes/"
      # Feature cards scraped from the open-source docs repo (docs.redhat.com blocks bots).
      # {minor_dash} = minor with dots as dashes (4-19).
      features_url: "https://raw.githubusercontent.com/openshift/openshift-docs/enterprise-{minor}/release_notes/ocp-{minor_dash}-release-notes.adoc"
      attributes_url: "https://raw.githubusercontent.com/openshift/openshift-docs/enterprise-{minor}/_attributes/common-attributes.adoc"
      attributes:
        product-title: "OpenShift Container Platform"
      # Full-history coverage: EOL minors below chart min_version
      extra_minors: ["4.1", "4.2", "4.3", "4.4", "4.5", "4.6", "4.7", "4.8", "4.9", "4.10", "4.11"]
    phase_map:
      "General availability": ga
      "Full support": fs_end
      "Maintenance support": mnt_end
      "Extended update support": eus1_end
      "Extended update support Term 2": eus2_end
      "Extended update support Term 3": eus3_end
      "Extended life phase": elp_end
    fallback:
      "4.12": { ga: "2023-01-17", fs_end: "2023-08-17", mnt_end: "2024-07-17", eus1_end: "2025-01-17", eus2_end: "2026-01-17" }
      "4.13": { ga: "2023-05-17", fs_end: "2024-01-31", mnt_end: "2024-11-17" }
      "4.14": { ga: "2023-10-31", fs_end: "2024-05-27", mnt_end: "2025-05-01", eus1_end: "2025-10-31", eus2_end: "2026-10-31" }
      "4.15": { ga: "2024-02-27", fs_end: "2024-09-27", mnt_end: "2025-08-27" }
      "4.16": { ga: "2024-06-27", fs_end: "2025-01-01", mnt_end: "2025-12-27", eus1_end: "2026-06-27", eus2_end: "2027-06-27" }
      "4.17": { ga: "2024-10-01", fs_end: "2025-05-25", mnt_end: "2026-04-01" }
      "4.18": { ga: "2025-02-25", fs_end: "2025-09-17", mnt_end: "2026-08-25", eus1_end: "2027-02-25", eus2_end: "2028-02-25" }
      "4.19": { ga: "2025-06-17", fs_end: "2026-01-21", mnt_end: "2026-12-17" }
      "4.20": { ga: "2025-10-21", fs_end: "2026-05-03", mnt_end: "2027-04-21", eus1_end: "2027-10-21", eus2_end: "2028-10-21" }
      "4.21": { ga: "2026-02-03", fs_end: "2026-08-03", mnt_end: "2027-08-03" }

  rhel:
    api_name: "Red Hat Enterprise Linux"
    title: "RHEL Lifecycle"
    # Feature-only details page: no errata_query (RHEL erratas are not x.y.z
    # versioned and volume is huge); minors come from the rhel_minors block (8+).
    details:
      minors_from: rhel_minors
      features_search: "*red_hat_enterprise_linux*{minor}_release_notes*"
      release_notes_url: "https://docs.redhat.com/en/documentation/red_hat_enterprise_linux/{major}/html/{minor}_release_notes/"
    page_url: "https://access.redhat.com/support/policy/updates/errata"
    info_html: "<b>Standard subscription</b> covers each minor release (~6 months). <b>Premium subscription additional maintenance</b> extends even minors by 2 years (EUS). <b>Extended Life Cycle, Premium subscription additional maintenance</b> (ELC) adds 6 years from GA on even minors from RHEL 9.2+, 8.10, and 10.2+. <b>Long Life add-on terms</b> extend the last minor of a major (8.10, 9.10, 10.10). RHEL 7 uses the legacy <b>Extended life cycle support (ELS) add-on</b> instead of ELC. Dates are from the <a href=\"https://access.redhat.com/support/policy/updates/errata\" target=\"_blank\">errata policy</a>, not the lifecycle API."
    version_strategy: rhel-major
    min_version: "7"
    has_minors: true
    use_major_phases: true

