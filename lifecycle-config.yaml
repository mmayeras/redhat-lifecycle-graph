      "2.6": { ga: "2025-10-01", fs_end: "2026-10-01", mnt_end: "2027-10-01", mnt2_end: "2028-10-01" }
      "2.7": { ga: "2026-10-01", fs_end: "2027-10-01", mnt_end: "2028-10-01", mnt2_end: "2029-10-01" }

  rhoai:
