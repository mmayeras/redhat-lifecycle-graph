name: Update Lifecycle Charts

on:
  schedule:
    - cron: "0 6 * * *"   # Every day at 06:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI
  push:
    branches: [main]
    paths:
      - lifecycle-graph.py
      - lifecycle-config.yaml
      - LIFECYCLE.md
      - "tests/**"
      - "static/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rsvg-convert
        run: sudo apt-get install -y librsvg2-bin

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate HTML + SVG + PNG (all products)
        run: python3 lifecycle-graph.py --product all --png --output-dir docs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          if git diff --cached --quiet; then
            echo "No changes — lifecycle data unchanged."
          else
            git commit -m "chore: update lifecycle charts ($(date -u +%Y-%m-%d))"
            git push
          fi
